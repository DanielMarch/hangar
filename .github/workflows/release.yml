name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Every release tag runs the strict variant: a skipped invariant check is a
  # hard failure here, never silently shipped (Makefile ci-strict / STRICT=1).
  ci-strict:
    name: make ci-strict
    runs-on: ubuntu-latest
    # Throwaway, structurally-valid configuration for the CI database and
    # for every `hangar` subcommand `make ci-strict` shells out to. These
    # are NOT secrets: HANGAR_MASTER_KEY is a fixed all-zero 32-byte key and
    # the SSO values are placeholders that never reach login.eveonline.com.
    #
    # PHASE 15.1: the job used to export HANGAR_DB_URL alone, and both
    # `migrate up` and `check-identifiers` shell out to `hangar`, which
    # validates the WHOLE configuration at boot and aborts on any missing
    # secret. That fail-fast behaviour is deliberate (a Phase 0 exit
    # criterion), so the fix is to supply the configuration rather than to
    # weaken the check — under STRICT=1 a skipped check-identifiers is a
    # hard failure, so this job could not have gone green without it.
    env:
      HANGAR_DB_URL: postgres://hangar:hangar@localhost:5432/hangar?sslmode=disable
      HANGAR_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HANGAR_SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HANGAR_SSO_CLIENT_ID: ci-placeholder-client-id
      HANGAR_SSO_CLIENT_SECRET: ci-placeholder-client-secret
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hangar
          POSTGRES_PASSWORD: hangar
          POSTGRES_DB: hangar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hangar -d hangar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --help
      # Phase 15 fix — same as ci.yml: check-identifiers is mandatory
      # under STRICT and needs real schema to check against.
      - name: migrate up
        run: go run ./cmd/hangar migrate up

      - name: make ci-strict
        run: make ci-strict

  # SRS §9.2 release matrix: linux/amd64, linux/arm64, windows/amd64. All
  # CGO_ENABLED=0 — a single accidental cgo dependency silently produces a
  # dynamically linked binary that fails on the distroless runtime image.
  binaries:
    name: build binaries
    needs: ci-strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build SPA
        run: cd web && pnpm install --frozen-lockfile && pnpm run build

      - name: Build release matrix
        run: make build-all VERSION=${{ github.ref_name }}

      - name: Checksums
        run: |
          cd bin
          sha256sum hangar-* > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hangar-binaries
          path: |
            bin/hangar-*
            bin/checksums.txt

  # Public registry push — the turnkey docker-compose.yml (Gate 5) only ever
  # pulls this image; it never builds locally.
  docker:
    name: build and push image
    needs: ci-strict
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

  release:
    name: publish GitHub Release
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hangar-binaries
          path: bin
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/hangar-*
            bin/checksums.txt
          generate_release_notes: true
