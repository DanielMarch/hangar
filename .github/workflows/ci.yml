name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # `make ci-strict` is the single source of truth for "does this branch
  # pass"; everything else in this file is the build/push matrix around it.
  #
  # PHASE 15 FIX: this job ran plain `make ci` through Phase 14.1, even
  # though the Makefile's own header comment ("Set STRICT=1 ... CI does,
  # from Phase 15 onward") always said this job would switch to
  # ci-strict once Phase 15 landed — release.yml's tag-triggered job was
  # the only one ever running ci-strict. A skip could ship silently on
  # every push/PR into main right up to a release tag. Now that Phase 15
  # exists, this job matches the Makefile's own documented intent.
  ci:
    name: make ci-strict
    runs-on: ubuntu-latest
    # Throwaway, structurally-valid configuration for the CI database and
    # for every `hangar` subcommand `make ci-strict` shells out to. These
    # are NOT secrets: HANGAR_MASTER_KEY is a fixed all-zero 32-byte key and
    # the SSO values are placeholders that never reach login.eveonline.com.
    #
    # PHASE 15.1: the job used to export HANGAR_DB_URL alone, and both
    # `migrate up` and `check-identifiers` shell out to `hangar`, which
    # validates the WHOLE configuration at boot and aborts on any missing
    # secret. That fail-fast behaviour is deliberate (a Phase 0 exit
    # criterion), so the fix is to supply the configuration rather than to
    # weaken the check — under STRICT=1 a skipped check-identifiers is a
    # hard failure, so this job could not have gone green without it.
    env:
      HANGAR_DB_URL: postgres://hangar:hangar@localhost:5432/hangar?sslmode=disable
      HANGAR_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HANGAR_SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HANGAR_SSO_CLIENT_ID: ci-placeholder-client-id
      HANGAR_SSO_CLIENT_SECRET: ci-placeholder-client-secret
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hangar
          POSTGRES_PASSWORD: hangar
          POSTGRES_DB: hangar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hangar -d hangar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --help # cache the binary; `make lint` invokes it for real below
          skip-cache: false

      # check-identifiers (STRICT now makes this mandatory, not skippable)
      # needs real schema to check identifier columns against — migrate
      # the service Postgres up first. This step didn't exist before
      # Phase 15 because STRICT=0 never made a missing/unreachable
      # precondition fatal; under ci-strict it would be.
      - name: migrate up
        run: go run ./cmd/hangar migrate up

      - name: make ci-strict
        run: make ci-strict

      - name: go test -tags=integration (Testcontainers)
        run: make test-integration

  # SRS §9.2: the release matrix must include windows/amd64. Path separators
  # and embed.FS (always forward-slash) diverge between GOOS values — this
  # job catches that in CI, not at release, by actually cross-compiling all
  # three targets on every push.
  build-matrix:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build SPA
        run: cd web && pnpm install --frozen-lockfile && pnpm run build

      - name: Cross-compile (CGO_ENABLED=0 is contractual, SRS §9.2)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          go build -trimpath -ldflags="-s -w" -o "bin/hangar-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/hangar

      - name: Verify static binary has no dynamic links (Linux targets)
        if: matrix.goos == 'linux'
        run: |
          file "bin/hangar-${{ matrix.goos }}-${{ matrix.goarch }}" | tee /dev/stderr | grep -q "statically linked"

      - uses: actions/upload-artifact@v4
        with:
          name: hangar-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/hangar-*
          retention-days: 7

  # The image build itself is part of `make ci`'s contract even though it
  # isn't in the Makefile's `ci` target: it needs docs/openapi.json to exist
  # (Phase 0's stub) and nothing else. This job proves that end to end on
  # every push without pushing anywhere; release.yml does the real push.
  docker-build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hangar:ci
