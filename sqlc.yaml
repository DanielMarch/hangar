# Project HANGAR — sqlc configuration (SRS §3.1, Principle 10).
#
# Principle 9 is enforced HERE, not by convention: every NUMERIC column is
# overridden to shopspring/decimal. If an override is missing, sqlc emits
# pgtype.Numeric (acceptable) or float64 (a Principle 9 violation) — the
# `make check-money` reflection test is the backstop.
#
# Principle 13 is enforced by `hangar admin verify-identifier-types`, which
# compares every generated identifier field against the ingested OpenAPI schema.
# bigint <-> uuid coercion must fail the build, not be silently overridden here.

version: "2"

sql:
  - name: app
    engine: postgresql
    schema: "db/migrations"
    queries: "db/queries"
    strict_function_checks: true
    # No `database:` block on purpose. `sqlc vet` runs in `make lint` with no
    # database available, so only the connection-free rules below are listed in
    # `rules:`. The `sqlc/db-prepare` rule needs a live server and therefore runs
    # from `make test-integration`, which has a Testcontainers PostgreSQL 18.
    #
    # PHASE 1a FIX: this `rules:` key did not exist before — the two rules
    # under the top-level `rules:` section were defined but never referenced,
    # so `sqlc vet` matched nothing (silently, since db/queries was empty
    # until this phase). `no-offset` is a hard prohibition (Principle: OFFSET
    # banned outright, §17 invariant 10) and belongs here. `flag-delete` is
    # deliberately NOT listed: sqlc vet has no warning/advisory severity, only
    # pass/fail, and 02_DATABASE_SCHEMA.md §3.6 asks it to "surface each [DELETE]
    # for review", not fail the build on every legitimate one (several exist
    # in this phase's queries — expired sessions, expired cache rows, stale
    # replicas — each with a comment explaining why a soft delete doesn't
    # apply). A reviewer can add `flag-delete` to this list locally to audit
    # DELETE usage; it should not be wired into `make ci`.
    rules:
      - no-offset
    gen:
      go:
        package: "gen"
        out: "internal/store/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true
        emit_json_tags: false          # DTOs live in internal/api/dto, never on store types
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        emit_enum_valid_method: false  # Principle 14: no Go enums for external vocabularies
        emit_all_enum_values: false
        query_parameter_limit: 3
        omit_unused_structs: false
        overrides:
          # ── Principle 9: money is exact, never float ──
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "NullDecimal"
              import: "github.com/shopspring/decimal"

          # ── Principle 13: uuid identifiers are uuid.UUID, never string/int64 ──
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "NullUUID"
              import: "github.com/google/uuid"

          # ── time ──
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "Time"
              pointer: true
              import: "time"

          # ── JSONB payloads (unparseable notification YAML, spec fragments,
          #    generic alert render data) stay as raw bytes: Principle 14 forbids
          #    validating shapes we do not control. ──
          #
          # PHASE 18 (SRS v3.1 §0 defect B12). The `nullable: true` variant
          # below did NOT exist before, so a NULLABLE jsonb column fell back
          # to sqlc's default and generated a plain `[]byte` — indistinguishable
          # by type from a genuinely binary `bytea` column. That is what
          # internal/api/dto/row.go keys on to decide nested-JSON versus hex,
          # so app.corporation.palette, app.notification_unknown_type
          # .sample_payload and app.character_notification.payload were
          # hex-encoded on the wire even after B12's converter fix, while the
          # 42 NOT NULL jsonb fields were repaired. §6's rule is about the
          # COLUMN's type, not its nullability; making both variants generate
          # json.RawMessage is what lets the converter enforce it by type
          # rather than by sniffing the bytes.
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type: "encoding/json.RawMessage"

          # ── intervals (route TTLs, coalescing windows) ──
          - db_type: "pg_catalog.interval"
            go_type: "time.Duration"

rules:
  # Connection-free rules only — see the note above `gen:`. `sqlc/db-prepare` is
  # deliberately absent here and is applied by the integration suite instead.
  #
  # Principle: OFFSET is prohibited (SRS §6). Keyset cursors only.
  #
  # PHASE 1a FIX: both rules below originally used a single-quoted CEL
  # string literal for the regex ('(?i)\boffset\b', '(?i)^\s*delete\s+from').
  # CEL string literals only recognise a fixed escape set (\n, \t, \\, \', …)
  # — \s and \b are not among them, so `sqlc vet` failed to even parse the
  # rule with "token recognition error at '\'" the moment db/queries had
  # content to vet against (Phase 0 shipped these rules unreachable, since
  # `make lint` skips `sqlc vet` entirely while db/queries is empty). CEL's
  # raw-string prefix (`r'...'`) turns off escape processing so \s and \b
  # reach RE2 literally; that is the fix, not a looser pattern.
  - name: no-offset
    message: "OFFSET is prohibited (SRS §6). Use a keyset cursor."
    rule: "query.sql.matches(r'(?i)\\boffset\\b')"
  # SRS §5.1: destructive DML is banned in migrations. Application DELETEs are
  # allowed only where a soft-delete is impossible; flag them for review.
  - name: flag-delete
    message: "DELETE detected — confirm a soft-delete is genuinely impossible here."
    rule: "query.sql.matches(r'(?i)^\\s*delete\\s+from')"
